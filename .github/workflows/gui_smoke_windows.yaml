# GUI smoke tests on a Windows runner: the scenarios of scripts/gui_smoke run
# the app with a fake game, on nightly and on this branch, and compare them.
name: GUI smoke (Windows)

on:
  push:
    branches: ['claude/epic-hopper-zgj7u6']
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Checkout commit
      uses: actions/checkout@v5
    - name: Check out nightly next to it, as the baseline
      run: |
        git fetch --depth=1 origin nightly
        git worktree add ../wb_nightly FETCH_HEAD
        git -C ../wb_nightly log -1 --oneline
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: 'x64'
    - name: Restore dependencies cache
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-wb_ci-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-wb_ci-
    - name: Install dependencies
      run: |
        python -m pip install -U pip "setuptools<82" wheel
        python -m pip install -r requirements.txt
    - name: Screen resolution
      continue-on-error: true
      run: |
        Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
        Set-DisplayResolution -Width 1920 -Height 1080 -Force
    - name: Run the GUI scenarios
      run: python scripts/gui_smoke/run.py --tree nightly=../wb_nightly/Mopy --tree branch=Mopy --out gui_out
    - name: Upload the outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: gui-smoke-out
        path: gui_out
